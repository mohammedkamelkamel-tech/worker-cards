name: Build Native APK V7

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Native V7 Project
        run: |
          echo "Preparing Native Android V7 project..."

          rm -rf project
          mkdir project

          unzip -q "ادارة_كروت_العامل_Native_Android_v7.zip" -d project

          echo "Project files:"
          ls -la project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Native APK V7
        working-directory: project
        run: |
          echo "Building Native Android APK V7..."
          gradle --no-daemon assembleDebug

      - name: Check APK
        run: |
          echo "Checking APK..."

          ls -lh project/app/build/outputs/apk/debug/

          test -f project/app/build/outputs/apk/debug/app-debug.apk

          echo "APK created successfully!"

      - name: Upload Native APK V7
        uses: actions/upload-artifact@v4
        with:
          name: إدارة-كروت-العامل-V7
          path: project/app/build/outputs/apk/debug/app-debug.apk
