name: Build Native APK V13

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and prepare Native V13 project
        run: |
          rm -rf project
          mkdir project

          echo "Searching for Native Android V13 ZIP..."

          NATIVE_ZIP=$(find . -maxdepth 1 -type f -name '*Native*Android*v13*.zip' | head -n 1)

          if [ -z "$NATIVE_ZIP" ]; then
            echo "ERROR: Native Android V13 ZIP not found."
            echo "Files in repository:"
            ls -lah
            exit 1
          fi

          echo "Found: $NATIVE_ZIP"

          unzip -q "$NATIVE_ZIP" -d project

          echo "Native project contents:"
          ls -lah project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Native APK V13
        working-directory: project
        run: |
          echo "Building Native Android APK V13..."
          gradle --no-daemon assembleDebug

      - name: Check APK
        run: |
          echo "Checking generated APK..."
          ls -lah project/app/build/outputs/apk/debug/
          test -f project/app/build/outputs/apk/debug/app-debug.apk
          echo "APK created successfully."

      - name: Upload Native APK V13
        uses: actions/upload-artifact@v4
        with:
          name: worker-cards-native-v13-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
