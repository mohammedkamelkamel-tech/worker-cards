name: Build مخزون كروت الكامل V24

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and prepare V24 project
        run: |
          rm -rf project
          mkdir project

          NATIVE_ZIP="./worker_cards_pro_v24_source_reviewed.zip"

          if [ ! -f "$NATIVE_ZIP" ]; then
            echo "ERROR: Modified V24 source ZIP not found: $NATIVE_ZIP"
            ls -lah
            exit 1
          fi

          echo "Using modified source: $NATIVE_ZIP"
          unzip -q "$NATIVE_ZIP" -d project

          GRADLE_FILE=$(find project -type f -name "settings.gradle" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            GRADLE_FILE=$(find project -type f -name "settings.gradle.kts" | head -n 1)
          fi

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: settings.gradle not found in the uploaded source archive."
            find project -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Android project found: $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app module not found."
            find "$PROJECT_DIR" -maxdepth 5 -type f
            exit 1
          fi

          echo "$PROJECT_DIR" > project_dir.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          PROJECT_DIR=$(cat project_dir.txt)
          cd "$PROJECT_DIR"
          echo "Building modified مخزون كروت الكامل V24 source"
          cat > /tmp/kotlin-alignment.init.gradle <<'EOF'
          allprojects {
              configurations.configureEach {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF
          gradle --no-daemon -I /tmp/kotlin-alignment.init.gradle assembleDebug

      - name: Prepare APK
        run: |
          PROJECT_DIR=$(cat project_dir.txt)
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found!"
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"
          cp "$APK" ./worker-cards-v24-debug.apk
          ls -lh ./worker-cards-v24-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: worker-cards-v24-debug-apk
          path: ./worker-cards-v24-debug.apk
          if-no-files-found: error
