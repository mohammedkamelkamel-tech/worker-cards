name: Build مخزون كروت الكامل V23

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and prepare V23 project
        run: |
          rm -rf project
          mkdir project

          echo "Searching for V23 ZIP..."

          NATIVE_ZIP=$(find . -maxdepth 1 -type f -iname '*v23*.zip' | head -n 1)

          if [ -z "$NATIVE_ZIP" ]; then
            echo "ERROR: V23 ZIP not found."
            ls -lah
            exit 1
          fi

          echo "Found ZIP: $NATIVE_ZIP"

          unzip -q "$NATIVE_ZIP" -d project

          echo "Searching for Gradle project..."

          GRADLE_FILE=$(find project -type f -name "build.gradle" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: build.gradle not found."
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          echo "Found build.gradle:"
          echo "$GRADLE_FILE"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "Searching for directory containing app module..."

            PROJECT_DIR=$(find project -type d -name "app" -exec dirname {} \; | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Android app module not found."
            find project -maxdepth 6 -type f
            exit 1
          fi

          echo "FINAL PROJECT DIRECTORY:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt

          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          echo "Building from:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "Current directory:"
          pwd

          echo "Files:"
          ls -lah

          echo "Building مخزون كروت الكامل V23..."

          gradle --no-daemon assembleDebug

      - name: Check APK
        run: |
          PROJECT_DIR=$(cat project_dir.txt)

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK:"
          echo "$APK"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."

            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true

            exit 1
          fi

          ls -lh "$APK"

          echo "APK created successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: مخزون-كروت-الكامل-v23-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
