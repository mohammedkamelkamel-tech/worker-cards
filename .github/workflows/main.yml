name: Build Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and prepare native project
        run: |
          rm -rf project
          mkdir project

          echo "Searching for Native Android ZIP..."

          NATIVE_ZIP=$(find . -maxdepth 1 -type f -iname '*Native*Android*.zip' | head -n 1)

          if [ -z "$NATIVE_ZIP" ]; then
            echo "Native Android ZIP not found."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          echo "Found: $NATIVE_ZIP"

          unzip -q "$NATIVE_ZIP" -d project

          echo "Project files:"
          ls -la project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build native APK
        working-directory: project
        run: |
          echo "Starting native Android build..."
          gradle --no-daemon assembleDebug

      - name: Check APK
        run: |
          echo "Checking generated APK..."
          ls -lh project/app/build/outputs/apk/debug/
          test -f project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: worker-cards-native-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
