name: Build Native APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare native project
        run: |
          rm -rf project
          mkdir project
          unzip -q "Native_Android.zip" -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build native APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: worker-cards-native-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
